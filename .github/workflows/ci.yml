name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v5
      - name: Install package and dev dependencies
        run: |
          uv venv
          . .venv/bin/activate
          uv pip install -e '.[dev]'
      - name: Run verification bundle
        run: |
          . .venv/bin/activate
          bash scripts/verify.sh
      - name: Check portfolio image freshness
        run: |
          . .venv/bin/activate
          PYTHONPATH=src python scripts/generate_screenshots.py --check
